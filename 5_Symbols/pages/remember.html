<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember - AI Certification Prep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <script src="../js/nav.js"></script>
    <header class="app-header">
        <h1>Remember</h1>
        <p>Flashcard-style review for quick recall</p>
    </header>

    <div class="container">
        <!-- Filter Bar -->
        <div class="filter-bar">
            <span>Filter:</span>
            <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
            <button class="filter-btn" id="filter-unmastered" onclick="setFilter('unmastered')">Unmastered</button>
            <button class="filter-btn" id="filter-mastered" onclick="setFilter('mastered')">Mastered</button>
            <button class="reset-btn" onclick="resetMastery()" style="margin-left: auto;">🗑️ Reset Mastery</button>
            <button id="lang-toggle-btn" onclick="toggleLanguage()" title="Switch audio language"
                style="background:rgba(168,85,247,0.12);border:1px solid var(--accent-purple);color:var(--accent-purple);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:0.85em;font-family:inherit;font-weight:600;transition:all 0.2s;">🌐 EN</button>
        </div>

        <div class="remember-container">
            <div id="remember-content"></div>
        </div>
    </div>

    <footer class="app-footer">
        <p>AI Certification Prep</p>
        <p>Created by Rifat Erdem Sahin</p>
        <div class="footer-links">
            <a href="../../index.html">🏠 Home</a>
            <a href="cards.html">🃏 Cards</a>
            <a href="quiz.html">📝 Quiz</a>
            <a href="exam.html">📋 Exam</a>
            <a href="mastery.html">🎯 Mastery</a>
            <a href="https://github.com/rifaterdemsahin/ai_certification_prepare" target="_blank">GitHub</a>
        </div>
    </footer>

    <script src="../js/data.js"></script>
    <script src="../js/data_loader.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        function initRemember() {
            state.filter = 'all';
            state.rememberIndex = 0;
            state.showRememberAnswer = false;
            renderRemember();
        }

        function getFilteredQuestions() {
            if (state.filter === 'mastered') {
                return questionsData.filter(q => state.progress[q.id]);
            } else if (state.filter === 'unmastered') {
                return questionsData.filter(q => !state.progress[q.id]);
            }
            return questionsData;
        }

        function setFilter(filterType) {
            state.filter = filterType;
            state.rememberIndex = 0;
            state.showRememberAnswer = false;
            
            // Update active class on filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const btnType = btn.id.replace('filter-', '');
                btn.classList.toggle('active', btnType === filterType);
            });
            
            renderRemember();
        }

        function toggleMastery(id) {
            const scrollY = window.scrollY;
            if (state.progress[id]) {
                delete state.progress[id];
            } else {
                state.progress[id] = true;
                showMasteredReward();
            }
            saveProgress(state.progress);
            renderRemember();
            requestAnimationFrame(() => window.scrollTo(0, scrollY));
        }

        function showMasteredReward() {
            const reward = document.createElement('div');
            reward.className = 'mastered-reward';
            reward.innerHTML = `
                <div class="mastered-reward-inner">
                    <div class="emoji">🎉</div>
                    <div>Question Mastered!</div>
                </div>
            `;
            document.body.appendChild(reward);
            setTimeout(() => reward.remove(), 1200);
        }

        function resetMastery() {
            if (confirm('Are you sure you want to reset all mastered progress?')) {
                state.progress = {};
                saveProgress(state.progress);
                state.rememberIndex = 0;
                state.showRememberAnswer = false;
                renderRemember();
            }
        }

        function renderRemember() {
            const container = document.getElementById('remember-content');
            const filtered = getFilteredQuestions();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="remember-card fade-in" style="text-align: center; padding: 40px 20px;">
                        <div style="font-size: 3em; margin-bottom: 20px;">🎉</div>
                        <h3>No questions found!</h3>
                        <p style="color: var(--text-secondary); margin-top: 10px; margin-bottom: 20px;">
                            ${state.filter === 'unmastered' 
                                ? 'Congratulations! You have mastered all questions under this view.' 
                                : 'No questions match the current filter.'}
                        </p>
                        <button class="mastery-btn" onclick="setFilter('all')">Show All Questions</button>
                    </div>
                `;
                return;
            }

            if (state.rememberIndex >= filtered.length) {
                state.rememberIndex = 0;
            }

            const q = filtered[state.rememberIndex];
            const hint = questionHints[q.id];
            const isLast = state.rememberIndex >= filtered.length - 1;

            const audioUrl = q.audioUrl || '';
            const audioUrlTr = q.audioUrlTr || '';
            const lang = getUserLanguage();
            let audioBtn = '';
            if (audioUrl) {
                if (lang === 'tr' && audioUrlTr) {
                    audioBtn = `
                        <button class="remember-audio-btn" id="audio-btn-en-${q.id}" data-default-label="🔊 EN Audio"
                            onclick="event.stopPropagation(); playAudio('${audioUrl}', 'audio-btn-en-${q.id}')">🔊 EN Audio</button>
                        <button class="remember-audio-btn-tr" id="audio-btn-tr-${q.id}" data-default-label="🔊 TR Audio"
                            onclick="event.stopPropagation(); playAudio('${audioUrlTr}', 'audio-btn-tr-${q.id}')">🔊 TR Audio</button>`;
                } else {
                    audioBtn = `
                        <button class="remember-audio-btn" id="audio-btn-${q.id}" data-default-label="🔊 Play Audio"
                            onclick="event.stopPropagation(); playAudio('${audioUrl}', 'audio-btn-${q.id}')">🔊 Play Audio</button>`;
                }
            }

            const isMastered = !!state.progress[q.id];
            const masteryBtn = `
                <button class="mastery-btn ${isMastered ? 'mastered' : ''}" onclick="event.stopPropagation(); toggleMastery('${q.id}')">
                    ${isMastered ? '✅ Mastered' : '🎯 Mark Mastered'}
                </button>
            `;

            container.innerHTML = `
                <div class="remember-card fade-in" onclick="toggleAnswer()">
                    <div class="quiz-meta">
                        <span class="card-category cat-${q.category}">${categories[q.category].name}</span>
                        <span>${state.rememberIndex + 1} / ${filtered.length}</span>
                    </div>

                    <div class="exam-progress-bar">
                        <div class="progress-label">Progress</div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${(state.rememberIndex / filtered.length) * 100}%"></div>
                        </div>
                    </div>

                    <div class="remember-question">${escapeHtml(q.question)}</div>

                    <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: center; align-items: center; flex-wrap: wrap;">
                        ${audioBtn}
                        ${masteryBtn}
                    </div>

                    ${state.showRememberAnswer ? `
                        <div class="remember-answer">${escapeHtml(q.answer)}</div>
                        ${q.imageUrl ? `
                            <div class="remember-image">
                                <img src="${q.imageUrl}" alt="Memory visual for ${escapeHtml(q.question)}" loading="lazy" onerror="this.parentElement.style.display='none'">
                            </div>
                        ` : ''}
                        ${hint ? `
                            <div class="remember-hint">
                                <div style="font-size:2em;margin-bottom:8px;">${hint.emoji}</div>
                                <div style="color:var(--accent-yellow);font-style:italic;">${escapeHtml(hint.memory)}</div>
                            </div>
                        ` : ''}
                    ` : '<p style="color:var(--text-muted);margin-top:20px;">👆 Click to reveal answer</p>'}

                    <div class="remember-nav">
                        <button onclick="event.stopPropagation(); prevRemember()" ${state.rememberIndex === 0 ? 'disabled' : ''}>⬅️ Prev</button>
                        <button class="btn-reveal" onclick="event.stopPropagation(); toggleAnswer()">${state.showRememberAnswer ? '🙈 Hide' : '👁️ Show'}</button>
                        <button onclick="event.stopPropagation(); nextRemember()">${isLast ? '🔁 Restart' : 'Next ➡️'}</button>
                    </div>
                </div>
            `;
        }

        let currentAudio = null;
        function playAudio(url, btnId) {
            const btn = document.getElementById(btnId);
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                currentAudio = null;
                document.querySelectorAll('.remember-audio-btn, .remember-audio-btn-tr').forEach(b => {
                    b.classList.remove('playing');
                    b.textContent = b.dataset.defaultLabel || '🔊 Play Audio';
                });
                if (btn && btn.dataset.activeUrl === url) return;
            }
            currentAudio = new Audio(url);
            currentAudio.play().catch(() => {});
            if (btn) {
                btn.dataset.activeUrl = url;
                btn.classList.add('playing');
                btn.textContent = '⏹ Stop';
            }
            currentAudio.onended = () => {
                if (btn) {
                    btn.classList.remove('playing');
                    btn.textContent = btn.dataset.defaultLabel || '🔊 Play Audio';
                    delete btn.dataset.activeUrl;
                }
            };
        }

        function toggleLanguage() {
            const current = getUserLanguage();
            setUserLanguage(current === 'tr' ? 'en' : 'tr');
            updateLangToggleBtn();
            renderRemember();
        }

        function updateLangToggleBtn() {
            const btn = document.getElementById('lang-toggle-btn');
            if (!btn) return;
            const lang = getUserLanguage();
            if (lang === 'tr') {
                btn.textContent = '🇹🇷 TR';
                btn.style.background = 'rgba(245,158,11,0.15)';
                btn.style.borderColor = 'var(--accent-orange)';
                btn.style.color = 'var(--accent-orange)';
            } else {
                btn.textContent = '🌐 EN';
                btn.style.background = 'rgba(168,85,247,0.12)';
                btn.style.borderColor = 'var(--accent-purple)';
                btn.style.color = 'var(--accent-purple)';
            }
        }

        function toggleAnswer() {
            state.showRememberAnswer = !state.showRememberAnswer;
            renderRemember();
        }

        function stopAudio() {
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                currentAudio = null;
            }
        }

        function nextRemember() {
            stopAudio();
            const filtered = getFilteredQuestions();
            if (filtered.length === 0) return;

            if (state.rememberIndex < filtered.length - 1) {
                state.rememberIndex++;
                state.showRememberAnswer = false;
            } else {
                state.rememberIndex = 0;
                state.showRememberAnswer = false;
            }
            renderRemember();
        }

        function prevRemember() {
            stopAudio();
            if (state.rememberIndex > 0) {
                state.rememberIndex--;
                state.showRememberAnswer = false;
                renderRemember();
            }
        }

        // Initialize after Azure data is ready
        window.dataReady.then(() => { updateLangToggleBtn(); initRemember(); });
    </script>
</body>
</html>
