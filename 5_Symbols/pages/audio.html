<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Claude Developer Certification - Audio Diagnostics and Simulation Interface">
    <title>Audio Matrix Interface — Claude Dev Cert</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111827;
            --border: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --matrix-green: #00ff66;
            --matrix-green-dim: #008833;
            --accent-purple: #a855f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Matrix Canvas Background */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }

        .site-nav {
            position: relative;
            z-index: 10;
        }

        .container {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .matrix-header {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .matrix-title {
            font-family: 'Fira Code', monospace;
            font-size: 2.5rem;
            color: var(--matrix-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.6), 0 0 20px rgba(0, 255, 102, 0.3);
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .matrix-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
            opacity: 0.8;
        }

        /* Play Button & Interface Container */
        .player-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 2px solid var(--matrix-green-dim);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.1), inset 0 0 20px rgba(0, 255, 102, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            transition: all 0.3s ease;
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .player-card:hover {
            border-color: var(--matrix-green);
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.25), inset 0 0 20px rgba(0, 255, 102, 0.1);
        }

        /* Big Play Button */
        .play-button-container {
            position: relative;
            width: 160px;
            height: 160px;
        }

        .play-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #1f2937 0%, #111827 100%);
            border: 4px solid var(--matrix-green-dim);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 5;
        }

        .play-btn::before {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%;
            border: 2px dashed var(--matrix-green-dim);
            opacity: 0.5;
            animation: rotateDashed 20s linear infinite;
        }

        .play-btn:hover {
            border-color: var(--matrix-green);
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
        }

        .play-btn:hover::before {
            border-color: var(--matrix-green);
            opacity: 0.8;
        }

        .play-icon {
            font-size: 4rem;
            color: var(--matrix-green);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            transition: all 0.3s ease;
            margin-left: 8px; /* Offset to center the play triangle visually */
        }

        .playing .play-icon {
            margin-left: 0;
        }

        /* Pulsing Rings when Playing */
        .pulse-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid var(--matrix-green);
            opacity: 0;
            transform: scale(1);
            pointer-events: none;
        }

        .playing .pulse-ring-1 {
            animation: pulseOut 2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
        }

        .playing .pulse-ring-2 {
            animation: pulseOut 2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
            animation-delay: 0.6s;
        }

        .playing .pulse-ring-3 {
            animation: pulseOut 2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
            animation-delay: 1.2s;
        }

        /* Status & Track Info */
        .track-info {
            width: 100%;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid var(--matrix-green-dim);
            color: var(--matrix-green);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .track-title {
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .track-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 320px;
            margin: 0 auto;
        }

        /* Visualizer simulation */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
            width: 100%;
        }

        .bar {
            width: 4px;
            height: 5px;
            background-color: var(--matrix-green);
            border-radius: 2px;
            transition: height 0.1s ease;
            opacity: 0.3;
        }

        .playing .bar {
            animation: bounceBar 1.2s ease-in-out infinite alternate;
            opacity: 0.85;
        }

        /* Unique animation speeds for visualizer bars */
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.4s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.6s; }
        .bar:nth-child(5) { animation-delay: 0.3s; }
        .bar:nth-child(6) { animation-delay: 0.5s; }
        .bar:nth-child(7) { animation-delay: 0.1s; }
        .bar:nth-child(8) { animation-delay: 0.4s; }
        .bar:nth-child(9) { animation-delay: 0.2s; }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes rotateDashed {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseOut {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes bounceBar {
            0% { height: 5px; }
            100% { height: 35px; }
        }
    </style>
</head>
<body>
    <script src="../js/nav.js"></script>

    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="matrix-header">
            <h1 class="matrix-title"><span>🎧</span> SYSTEM AUDIO INTERFACE</h1>
            <p class="matrix-subtitle">Claude Dev Cert / Audio Diagnostic & Simulation Matrix</p>
        </div>

        <div class="player-card">
            <div class="track-info">
                <span class="status-badge" id="status-badge">READY</span>
                <h3 class="track-title" id="display-title">Audio Synthesizer</h3>
                <p class="track-desc">Generates a futuristic cyberpunk ambient drone to tune focus during exam prep sessions.</p>
            </div>

            <div class="play-button-container" id="play-container">
                <div class="pulse-ring pulse-ring-1"></div>
                <div class="pulse-ring pulse-ring-2"></div>
                <div class="pulse-ring pulse-ring-3"></div>
                <button class="play-btn" id="play-button" aria-label="Play Matrix Sound">
                    <span class="play-icon" id="play-icon">▶</span>
                </button>
            </div>

            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Matrix Falling Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const katakana = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const alphabet = katakana.split('');

        const fontSize = 16;
        let columns = canvas.width / fontSize;

        const rainDrops = [];

        function initRain() {
            columns = canvas.width / fontSize;
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = Math.random() * -100;
            }
        }
        initRain();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 15, 29, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(drawMatrix, 30);

        // Web Audio API Ambient Synthesizer
        let audioCtx = null;
        let isPlaying = false;
        let osc1, osc2, gainNode, filterNode, lfo;

        const playButton = document.getElementById('play-button');
        const playIcon = document.getElementById('play-icon');
        const playContainer = document.getElementById('play-container');
        const statusBadge = document.getElementById('status-badge');
        const displayTitle = document.getElementById('display-title');

        function startAudio() {
            // Create Audio Context
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Osc 1: Base low-frequency hum
            osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(55, audioCtx.currentTime); // A1 note

            // Osc 2: Harmonic frequency
            osc2 = audioCtx.createOscillator();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(110, audioCtx.currentTime); // A2 note

            // Lowpass filter for analog warmth
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(200, audioCtx.currentTime);
            filterNode.Q.setValueAtTime(5, audioCtx.currentTime);

            // Volume control
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime); // low volume safe level

            // LFO to modulate filter cutoff frequency
            lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(0.2, audioCtx.currentTime); // 0.2 Hz modulation rate

            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(120, audioCtx.currentTime);

            // Connect routing
            lfo.connect(lfoGain);
            lfoGain.connect(filterNode.frequency);

            osc1.connect(filterNode);
            osc2.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // Start generators
            osc1.start();
            osc2.start();
            lfo.start();
        }

        function stopAudio() {
            if (osc1) osc1.stop();
            if (osc2) osc2.stop();
            if (lfo) lfo.stop();
            if (audioCtx) audioCtx.close();
        }

        playButton.addEventListener('click', () => {
            if (!isPlaying) {
                try {
                    startAudio();
                    isPlaying = true;
                    playContainer.classList.add('playing');
                    playIcon.textContent = '■';
                    statusBadge.textContent = 'TRANSMITTING';
                    displayTitle.textContent = 'Audio Streaming Active';
                } catch(e) {
                    console.error("Audio Context initialization failed", e);
                }
            } else {
                stopAudio();
                isPlaying = false;
                playContainer.classList.remove('playing');
                playIcon.textContent = '▶';
                statusBadge.textContent = 'PAUSED';
                displayTitle.textContent = 'Audio Synthesizer';
            }
        });
    </script>
</body>
</html>
